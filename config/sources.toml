# Fontes do Expresso.
#
# O boletim cobre três frentes — programacao, produto e ia. O campo `track`
# agrupa os feeds para dar para ver, de relance, se alguma está descoberta.
# Editar uma fonte aqui é commit de dado, não de código.

# --- Programação e engenharia --------------------------------------------

[[feeds]]
track = "programacao"
name = "GitHub Blog"
url = "https://github.blog/feed/"

[[feeds]]
track = "programacao"
name = "Stack Overflow"
url = "https://stackoverflow.blog/feed/"

[[feeds]]
track = "programacao"
name = "Pragmatic Engineer"
url = "https://blog.pragmaticengineer.com/rss/"

[[feeds]]
track = "programacao"
name = "InfoQ"
url = "https://feed.infoq.com/"

[[feeds]]
track = "programacao"
name = "Cloudflare"
url = "https://blog.cloudflare.com/rss/"

[[feeds]]
track = "programacao"
name = "Simon Willison"
url = "https://simonwillison.net/atom/everything/"

