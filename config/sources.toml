# --- Hacker News ----------------------------------------------------------

[hacker_news]
terms = [
  "AI",
  "LLM",
  "OpenAI",
  "Anthropic",
  "programming language",
  "developer tools",
  "database",
  "startup funding",
  "Show HN",
]

# --- Filtros --------------------------------------------------------------

# Pedaços de URL que denunciam cupom, guia de compra e review de gadget.
[filters]
ignored_patterns = [
  "/achados/",
  "/guias/",
  "/responde/",
  "/promocao",
  "/cupom",
  "/deals/",
  "/review/",
  "/best-",
  "/ofertas",
  "/melhores-",
]
