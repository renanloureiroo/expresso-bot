name: Expresso

on:
  schedule:
    - cron: "20 11 * * 1-5"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar mesmo se o boletim de hoje já saiu"
        type: boolean
        default: true

env:
  TIMEZONE: "America/Sao_Paulo"

concurrency:
  group: expresso
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e .

      - name: Montar e publicar o boletim
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.forcar && '1' || '0' }}
        run: python -m expresso

      - name: Guardar o que já foi publicado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || {
            git commit -m "Boletim de $(date -u +%d/%m)"
            git pull --rebase --autostash
            git push
          }

      - name: Avisar no Discord se quebrou
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"⚠️ O Expresso não saiu hoje. Log: $RUN\"}" \
            > /dev/null
