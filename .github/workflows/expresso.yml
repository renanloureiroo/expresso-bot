name: Expresso

on:
  # Não há `schedule` aqui de propósito. Quem marca as 7h é o Worker da
  # Cloudflare (worker/), que chama este workflow_dispatch pela API. O cron do
  # GitHub não entregou nenhuma das vezes em que foi testado neste repositório,
  # e um agendamento que dispara horas atrasado publicaria o boletim fora de
  # hora — pior do que não publicar. Se o dispatch falhar, o Worker avisa no
  # Discord.
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar mesmo se o boletim de hoje já saiu"
        type: boolean
        default: true

env:
  TIMEZONE: "America/Sao_Paulo"

concurrency:
  group: expresso
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e .

      - name: Montar e publicar o boletim
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.forcar && '1' || '0' }}
        run: python -m expresso

      - name: Guardar o que já foi publicado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "Nada novo no histórico."
            exit 0
          fi

          git commit -m "Boletim de $(date -u +%d/%m)"

          # Um commit que chegue ao main enquanto o boletim é escrito faz o push
          # ser recusado, e aí o boletim já saiu no Discord mas o histórico se
          # perde — o próximo dia republicaria o que já foi. Rebase e tenta de
          # novo; o history.json não conflita, já que ninguém mais mexe nele.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push recusado (tentativa $tentativa). Alguém empurrou primeiro; tentando de novo."
            sleep $((tentativa * 5))
          done

          echo "::error::O boletim saiu, mas o history.json não subiu em 3 tentativas."
          exit 1

      - name: Avisar no Discord se quebrou
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"⚠️ O Expresso não saiu hoje. Log: $RUN\"}" \
            > /dev/null
