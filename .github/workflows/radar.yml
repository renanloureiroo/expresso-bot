name: Radar de IA

on:
  schedule:
    # 10:00 UTC = 07:00 em São Paulo (UTC-3), de segunda a sexta.
    # O agendador do GitHub costuma atrasar alguns minutos em horário de pico.
    - cron: "0 10 * * 1-5"
  workflow_dispatch: # permite rodar na mão pelo botão "Run workflow"

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Montar e publicar o boletim
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python radar.py
