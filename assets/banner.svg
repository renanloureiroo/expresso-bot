      <stop offset="70%" stop-color="#8A93F8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#8A93F8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#5865F2" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#E0A45C" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#E0A45C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#B9C0FF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#B9C0FF" stop-opacity="0"/>
    </radialGradient>
