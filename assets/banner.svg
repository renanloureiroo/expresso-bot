      <stop offset="45%" stop-color="#7C87F7" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#C3C9FF" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="fio" x1="0" y1="0" x2="1" y2="0">
