<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Expresso — curadoria de A.I para notícias de tech, direto no Discord">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1733"/>
      <stop offset="50%" stop-color="#14111e"/>
      <stop offset="100%" stop-color="#251b17"/>
    </linearGradient>
    <linearGradient id="porcelana" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FBF6EF"/>
      <stop offset="55%" stop-color="#EADFD2"/>
      <stop offset="100%" stop-color="#C4B6A6"/>
    </linearGradient>
    <linearGradient id="pires" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6EFE6"/>
      <stop offset="100%" stop-color="#BFB1A1"/>
    </linearGradient>
    <linearGradient id="cafe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C99A63"/>
      <stop offset="42%" stop-color="#77462B"/>
      <stop offset="100%" stop-color="#3E200E"/>
    </linearGradient>
    <linearGradient id="vapor" x1="0" y1="1" x2="0" y2="0">
