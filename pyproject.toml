[project]
name = "expresso"
version = "1.0.0"
description = "Boletim diário de tecnologia no Discord: programação, produto e IA."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "google-genai>=1.33",
    "feedparser>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
